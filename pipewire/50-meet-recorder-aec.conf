# meet-recorder: echo-cancelled copy of the mic, for the recorder ONLY.
# Installed by install-local.sh to ~/.config/pipewire/pipewire.conf.d/.
# Takes effect after the next login, or (NOT during a call):
#   systemctl --user restart pipewire pipewire-pulse wireplumber
#
# monitor.mode: the echo reference is a stream capturing the monitor of the
# DEFAULT sink (stream.capture.sink, no target), so there is no virtual sink
# and Teams' playback path is untouched. The capture stream has no target
# either, so it follows the default mic. Both re-link when the default
# changes (headphone swaps mid-call).
#
# Never the default source, never auto-picked by apps: priority 1 loses to
# every real mic (ALSA sources are ~2000), and it is NOT a smart filter
# (filter.smart would splice it into every app's mic path). Teams keeps the
# raw mic and does its own echo cancellation. meet-recorder records from it
# by name (`[audio] mic_source = auto`, pw-record --target).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props = {
        node.name = "meet-recorder.aec-capture"
        node.description = "Meet recorder AEC capture"
        node.passive = true
        node.dont-reconnect = false
      }
      sink.props = {
        node.name = "meet-recorder.aec-reference"
        node.description = "Meet recorder AEC reference"
        node.passive = true
      }
      source.props = {
        node.name = "meet-recorder.aec-mic"
        node.description = "Meet recorder mic (echo-cancelled)"
        priority.session = 1
        priority.driver = 1
      }
    }
  }
]
